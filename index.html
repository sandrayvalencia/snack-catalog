<!doctype html>
<html>
  <head>
    <title>Snacks Catalog |Home</title>
    <meta name="description" content="A Catalog of snacks" />
    <link rel="stylesheet" href="style.css" />
    
  </head>

  <body>
    <header class="main-header">
      <h1 class="title">Snacks</h1>
    </header>
    <div id="card-container"></div>
    <div class="card" style="display: none">
      <div class="card-content">
        <h2>A Yummy Option</h2>
        <img src="" alt="Snack Image" />
        <ul>
          <li>Type</li>
          <li>Rating</li>
          <li>Where to buy</li>
        </ul>
      </div>
    </div>
    <div class="footer">
      <button onclick="quoteAlert()">Show Message</button>
      <button onclick="removeLastCard()">Remove A Snack!</button>
    </div>
    <script src="scripts.js"></script>
  </body>
</html>
